<!doctype HTML>
<html>
    <head>
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
        <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>
    </head>
    <body style='margin : 0px; overflow: hidden;'>
        <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
            
            <!-- Aquí cargamos los recursos (el video) -->
            <a-assets>
                <!-- Es importante incluir 'playsinline' y 'webkit-playsinline' para que funcione en móviles -->
                <!-- 'muted' ayuda a que el video pueda reproducirse automáticamente en la mayoría de los navegadores -->
                <video id="miVideo" src="Presentacion.mp4" autoplay loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
            </a-assets>

            <!-- Reemplazamos el a-box por un a-video, apuntando al id del video -->
            <!-- Puedes ajustar el width (ancho), height (alto) y rotation (rotación) según necesites -->
            <a-video src="#miVideo" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.125"></a-video>

            <a-marker-camera type='pattern' url='logo.patt'></a-marker-camera>
            
        </a-scene>

        <!-- Pequeño script para asegurar que el video se reproduzca al tocar la pantalla (requerido por las políticas de los navegadores) -->
        <script>
            window.addEventListener('click', function () {
                var v = document.querySelector('#miVideo');
                v.play();
            });
        </script>
    </body>
</html>
