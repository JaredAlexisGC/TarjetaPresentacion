<!doctype HTML>
<html>
    <head>
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <script src="https://aframe.io/releases/0.8.0/aframe.min.js"></script>
        <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.6.0/aframe/build/aframe-ar.js"></script>
    </head>
    <body style='margin : 0px; overflow: hidden;'>
        <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
            
            <a-assets>
                <video id="pre" src="Presentacion.mp4" autoplay loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
            </a-assets>
            <a-video src="#pre" position="0 0.5 0" rotation="-90 0 0" width="2" height="1.125"></a-video>

            <a-marker-camera type='pattern' url='logo.patt'></a-marker-camera>
            
        </a-scene>
        <script>
            window.addEventListener('click', function () {
                var v = document.querySelector('#pre');
                v.play();
            });
        </script>
    </body>
</html>
